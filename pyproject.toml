[project]
name = "michigan-ev-charging-lesson"
version = "0.1.0"
description = "LLM-assisted optimization from data to decision: an EV charger siting lesson."
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.14"
dependencies = [
    "gurobipy>=14.0,<15",
    "gurobipy-pandas>=1.2.2,<2",
    "numpy>=2.3,<3",
    "pandas>=3.0.5,<4",
    "websockets>=15,<17",
]

[tool.uv]
package = false
# Recorded in uv.lock; keep it here so `uv run --locked` works without a
# matching user-level uv setting.
exclude-newer = "P14D"
exclude-newer-package = { gurobipy = false }

[tool.ruff.lint]
ignore = ["E402"]

[tool.ty.environment]
extra-paths = ["model"]
