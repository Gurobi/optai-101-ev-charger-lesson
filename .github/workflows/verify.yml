name: Verify lesson

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lesson:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python lesson.py check
      - run: uv run --locked python -m unittest discover -s tests -v
